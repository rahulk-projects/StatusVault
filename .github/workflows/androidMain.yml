name: Build StatusVault APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract app project
        run: unzip -q StatusVault-Android-Project.zip -d source

      - name: Build debug APK
        run: gradle -p source/StatusVault assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StatusVault-debug-apk
          path: source/StatusVault/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
